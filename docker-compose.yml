# Local development services. Mirrors the AWS data tier:
#   db    -> Amazon RDS for PostgreSQL
#   redis -> Amazon ElastiCache (optional; set REDIS_URL=redis://localhost:6379 to use it)
services:
  db:
    image: postgres:16-alpine
    container_name: library-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "5433:5432"   # 5433 on the host so it does not clash with a locally installed PostgreSQL
    volumes:
      - library-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: library-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles: ["cache"]

volumes:
  library-db-data:
